name: Build ROM
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev

      - name: Build agbcc
        run: |
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh "$GITHUB_WORKSPACE"

      - name: Build Ruby and Sapphire
        run: |
          make -j$(nproc) ruby
          make -j$(nproc) sapphire

      - uses: actions/upload-artifact@v4
        with:
          name: pokeruby-sapphire
          path: "*.gba"
          retention-days: 1
